<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Voting</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #fff;
      --ink: #14202b;
      --mute: #5f6b7a;
      --line: #e2e7ee;
      --brand: #004165;
      --accent: #772432;
      --soft: #e8f0f6;
      --win: #eaf6ef;
      --winc: #1b7a43;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .05)
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #0f141a;
        --card: #18202a;
        --ink: #eef2f7;
        --mute: #9aa6b5;
        --line: #27313d;
        --brand: #5aa9d6;
        --accent: #e0899a;
        --soft: #1c2a37;
        --win: #152a1e;
        --winc: #5fd08c;
        --shadow: none
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px
    }

    header.top {
      background: #004165;
      color: #fff;
      border-bottom: 3px solid #772432;
      position: sticky;
      top: 0;
      z-index: 5
    }

    header.top .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      gap: 10px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .2px;
      min-width: 0
    }

    .brand span:last-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #fff;
      color: #004165;
      display: grid;
      place-items: center;
      font-weight: 800;
      flex: none
    }

    #nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none
    }

    .pill {
      font-size: .8rem;
      background: rgba(255, 255, 255, .14);
      padding: 4px 10px;
      border-radius: 99px;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .pill b {
      background: #fff;
      color: #004165;
      border-radius: 99px;
      padding: 1px 7px;
      margin-left: 4px;
      font-size: .7rem;
      text-transform: uppercase
    }

    #app {
      padding: 22px 0 90px
    }

    h1 {
      font-size: 1.45rem;
      margin: 0 0 4px;
      line-height: 1.25
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 12px
    }

    h3 {
      font-size: .95rem;
      margin: 0 0 6px
    }

    .sub,
    .mute {
      color: var(--mute);
      font-size: .92rem
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: var(--shadow)
    }

    .hero {
      border-left: 4px solid var(--accent)
    }

    .narrow {
      max-width: 400px;
      margin: 48px auto
    }

    .center {
      text-align: center
    }

    label.f {
      display: block;
      font-weight: 600;
      font-size: .85rem;
      margin: 10px 0 2px
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=date],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      margin: 2px 0 6px
    }

    textarea {
      resize: vertical
    }

    .btn,
    button {
      background: var(--brand);
      color: #fff;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      line-height: 1.3
    }

    button:hover,
    .btn:hover {
      filter: brightness(1.1)
    }

    .sec {
      background: transparent !important;
      color: var(--ink) !important;
      border-color: var(--line)
    }

    header .sec {
      color: #fff !important;
      border-color: rgba(255, 255, 255, .4)
    }

    .danger {
      background: #b42318 !important;
      color: #fff !important
    }

    .sm {
      padding: 6px 12px;
      font-size: .85rem
    }

    .full {
      width: 100%;
      padding: 12px
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid #5aa9d6;
      outline-offset: 2px
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 6px;
      overflow-x: auto
    }

    .tabs button {
      background: none;
      color: var(--mute);
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      padding: 10px 14px;
      white-space: nowrap
    }

    .tabs button.on {
      color: var(--brand);
      border-color: var(--accent)
    }

    .item {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-top: 1px solid var(--line)
    }

    .item:first-of-type {
      border-top: 0
    }

    .acts {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .st {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 2px 9px;
      border-radius: 99px;
      background: var(--soft);
      color: var(--brand);
      margin-left: 6px;
      vertical-align: middle
    }

    .st.open {
      background: var(--win);
      color: var(--winc)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      background: var(--soft);
      color: var(--brand);
      border: 0;
      border-radius: 99px;
      padding: 5px 12px;
      font-size: .85rem;
      font-weight: 600
    }

    .chip a {
      color: var(--accent);
      margin-left: 6px;
      text-decoration: none;
      font-weight: 700
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px
    }

    @media(max-width:600px) {
      .grid2 {
        grid-template-columns: 1fr
      }

      .pill {
        display: none
      }
    }

    .cat {
      padding: 16px 18px
    }

    .cat h2 {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    label.opt {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      margin: 8px 0;
      cursor: pointer;
      transition: .15s
    }

    label.opt:hover {
      border-color: var(--brand)
    }

    label.opt:has(input:checked) {
      border-color: var(--brand);
      background: var(--soft);
      font-weight: 600
    }

    label.opt input {
      accent-color: var(--brand);
      width: 18px;
      height: 18px
    }

    .sticky {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 12px 0;
      z-index: 4
    }

    .sticky .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .row {
      padding: 8px 10px;
      border-radius: 10px;
      margin: 4px 0
    }

    .row.w {
      background: var(--win)
    }

    .row .l {
      display: flex;
      justify-content: space-between;
      gap: 8px
    }

    .tag {
      font-size: .7rem;
      font-weight: 700;
      color: var(--winc);
      text-transform: uppercase;
      margin-left: 8px
    }

    .bar {
      height: 7px;
      background: var(--line);
      border-radius: 4px;
      margin-top: 6px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: 4px
    }

    .row.w .bar i {
      background: var(--winc)
    }

    .err {
      color: #b42318;
      font-size: .9rem;
      min-height: 1.2em
    }

    .note {
      background: var(--soft);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .9rem;
      margin: 10px 0
    }

    footer {
      text-align: center;
      color: var(--mute);
      font-size: .8rem;
      padding: 0 0 24px
    }

    footer a {
      color: var(--mute)
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="wrap"><a class="brand" href="#"><span class="logo">T</span><span id="bn"></span></a>
      <div id="nav"></div>
    </div>
  </header>
  <main class="wrap">
    <div id="app"></div>
  </main>
  <script>
    // ====== SUPABASE DETAILS ======
    const SUPABASE_URL = "https://drwxtmlpnsqxpkzhdyly.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jedKOEKXmaAZ5S_y21OdZg_BNaY8uqM";
    const CLUB_NAME = "Toastmasters Voting";
    // ==============================
    const CATS = [
      ["best_table_topic", "Best Table Topic"], ["best_prepared_speech", "Best Prepared Speech"],
      ["best_evaluator", "Best Evaluator"], ["best_facilitator", "Best Facilitator"],
      ["best_tmod", "Best Toastmaster of the Day (TMOD)"], ["best_ttm", "Best Table Topic Master"],
      ["best_ge", "Best General Evaluator"]
    ];
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const app = document.getElementById("app"), nav = document.getElementById("nav");
    document.getElementById("bn").textContent = CLUB_NAME;
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = d => d ? new Date(d + "T00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
    let dev = localStorage.getItem("dev"); if (!dev) { dev = crypto.randomUUID(); localStorage.setItem("dev", dev); }
    const voterUrl = () => location.origin + location.pathname;
    const guestNav = () => nav.innerHTML = `<a class="btn sec sm" href="#admin">Admin login</a>`;

    /* ---------- Results ---------- */
    async function showResults(m, el) {
      const { data, error } = await sb.rpc("get_results", { m: m.id });
      if (error) { el.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
      let html = `<div class="card hero"><h1>${esc(m.title)}</h1><div class="sub">${fmt(m.meeting_date)} &middot; Final results</div></div>`;
      for (const [key, label] of CATS) {
        const rows = (data || []).filter(r => r.category === key).sort((a, b) => b.votes - a.votes);
        if (!rows.length) continue;
        const max = rows[0].votes, total = rows.reduce((s, r) => s + Number(r.votes), 0);
        html += `<div class="card cat"><h2>${label}<span class="mute">${total} vote${total == 1 ? "" : "s"}</span></h2>` + rows.map(r => {
          const w = max > 0 && r.votes == max, pct = total ? Math.round(r.votes / total * 100) : 0;
          return `<div class="row ${w ? "w" : ""}"><div class="l"><span>${esc(r.name)}${w ? '<span class="tag">Winner</span>' : ""}</span><b>${r.votes} <span class="mute">(${pct}%)</span></b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
        }).join("") + `</div>`;
      }
      el.innerHTML = html;
    }

    /* ---------- Voter ---------- */
      async function voter() {
        guestNav();
        app.innerHTML = `<p class="mute center">Loading...</p>`;
        const { data: ms, error } = await sb.from("meetings").select("*").neq("status", "draft").order("created_at", { ascending: false });
        if (error) { app.innerHTML = `<div class="card"><p class="err">${esc(error.message)}</p></div>`; return; }
        const m = (ms || []).find(x => x.status === "open") || (ms || [])[0];
        if (!m) { app.innerHTML = `<div class="card center"><h2>No active meeting</h2><p class="mute">Voting is not open right now. Please check back during the meeting.</p></div>`; return; }
        if (m.status === "closed") { const d = document.createElement("div"); app.innerHTML = ""; app.appendChild(d); return showResults(m, d); }
        if (localStorage.getItem("voted_" + m.id)) { app.innerHTML = `<div class="card center hero"><h1>Thank you!</h1><p class="mute">Your vote for <b>${esc(m.title)}</b> has been recorded. Results will appear on this page when voting closes.</p></div>`; return; }
        const { data: cs } = await sb.from("candidates").select("*").eq("meeting_id", m.id).order("name");
        const cats = CATS.filter(([k]) => (cs || []).some(c => c.category === k));
        let html = `<div class="card hero"><h1>${esc(m.title)}</h1><div class="sub">${fmt(m.meeting_date)} &middot; Choose one name per category. You may skip any category.</div></div>`;
        for (const [key, label] of cats) html += `<div class="card cat"><h2>${label}</h2>` + cs.filter(c => c.category === key).map(c => `<label class="opt"><input type="radio" name="${key}" value="${c.id}">${esc(c.name)}</label>`).join("") + `</div>`;
        html += `<div class="sticky"><div class="wrap"><span class="mute" id="cnt"></span><div><span id="msg" class="err"></span> <button id="submit">Submit vote</button></div></div></div>`;
        app.innerHTML = html;
        const upd = () => $("cnt").textContent = `${cats.filter(([k]) => document.querySelector(`input[name="${k}"]:checked`)).length} of ${cats.length} selected`;
        app.addEventListener("change", upd); upd();
        $("submit").onclick = async () => {
          const rows = cats.map(([key]) => { const s = document.querySelector(`input[name="${key}"]:checked`); return s ? { meeting_id: m.id, category: key, candidate_id: s.value, device_id: dev } : null; }).filter(Boolean);
          if (!rows.length) { $("msg").textContent = "Select at least one name."; return; }
          const { error } = await sb.from("votes").insert(rows);
          if (error && error.code !== "23505") { $("msg").textContent = error.message.includes("row-level") ? "Voting is closed." : error.message; return; }
          localStorage.setItem("voted_" + m.id, "1"); voter();
        };
      }

      /* ---------- Admin ---------- */
      async function admin() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return loginView();
        const { data: prof, error } = await sb.from("profiles").select("role").eq("id", session.user.id).maybeSingle();
        if (!prof || prof.role !== "admin") {
          nav.innerHTML = `<button class="sec sm" id="out2">Log out</button>`;
          app.innerHTML = `<div class="card narrow center"><h1>Access denied</h1><p class="mute">${esc(session.user.email)} does not have admin access.</p>${error ? `<p class="err">${esc(error.message)}</p>` : ""}<a class="btn sec sm" href="#">Go to voting page</a></div>`;
          $("out2").onclick = async () => { await sb.auth.signOut(); admin(); }; return;
        }
        panel(session.user.email);
      }
      function loginView() {
        guestNav();
        app.innerHTML = `<div class="card narrow"><h1>Admin sign in</h1><p class="sub">For organizers only. Voters do not need an account; they scan the QR code to vote.</p>
  <label class="f" for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label class="f" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p id="msg" class="err"></p><button id="go" class="full">Sign in</button></div>`;
        const go = async () => { const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value }); if (error) $("msg").textContent = error.message; else admin(); };
        $("go").onclick = go; $("pw").onkeydown = e => { if (e.key === "Enter") go(); };
      }
      let curEmail, tab = "meetings", lastTa;
      window.go = t => { tab = t; panel(); };
      async function panel(email) {
        email = email || curEmail; curEmail = email;
        nav.innerHTML = `<span class="pill">${esc(email)}<b>Admin</b></span><button class="sec sm" id="out">Log out</button>`;
        $("out").onclick = async () => { await sb.auth.signOut(); admin(); };
        const [{ data: ro }, { data: ms }] = await Promise.all([sb.from("participants").select("*").order("name"), sb.from("meetings").select("*").order("created_at", { ascending: false })]);
        const tabs = [["meetings", "Meetings"], ["new", "New meeting"], ["people", "Participants"], ["qr", "QR code"]];
        let b = "";
        if (tab === "meetings") b = `<div class="card"><h2>Meetings</h2>` + ((ms || []).map(m => `<div><div class="item"><div><b>${esc(m.title)}</b><span class="st ${m.status}">${m.status}</span><div class="mute">${fmt(m.meeting_date)}</div></div>
    <div class="acts">${m.status !== "open" ? `<button class="sm" onclick="setStatus('${m.id}','open')">Open voting</button>` : `<button class="sm" onclick="setStatus('${m.id}','closed')">Close voting</button>`}
    <button class="sec sm" onclick="viewRes('${m.id}')">Results</button><button class="danger sm" onclick="delMeeting('${m.id}')">Delete</button></div></div><div id="r_${m.id}"></div></div>`).join("") || `<p class="mute">No meetings yet. Create one in the "New meeting" tab.</p>`) + `</div>`;
        if (tab === "new") b = `<div class="card"><h2>New meeting</h2><div class="grid2"><div><label class="f" for="t">Title</label><input id="t" type="text" placeholder="e.g. Meeting 12"></div><div><label class="f" for="d">Date</label><input id="d" type="date"></div></div>
    <div class="note">Type one name per line, or click a participant to add them to the box you are editing.</div>
    <div class="chips">${(ro || []).map(p => `<button type="button" class="chip" data-n="${esc(p.name)}">${esc(p.name)}</button>`).join("") || '<span class="mute">Add participants in the Participants tab first.</span>'}</div>
    <div class="grid2">${CATS.map(([k, l]) => `<div><label class="f" for="c_${k}">${l}</label><textarea id="c_${k}" rows="4"></textarea></div>`).join("")}</div>
    <p id="msg" class="err"></p><button id="save">Save meeting</button></div>`;
        if (tab === "people") b = `<div class="card"><h2>Participants (${(ro || []).length})</h2><p class="sub">Your member list. Add or remove names whenever members change.</p>
    <textarea id="pn" rows="3" placeholder="One name per line"></textarea><button id="addp">Add names</button></div>
    <div class="card"><div class="chips">${(ro || []).map(p => `<span class="chip">${esc(p.name)}<a href="#admin" onclick="delPart('${p.id}');return false" title="Remove">&times;</a></span>`).join("") || '<span class="mute">No participants yet.</span>'}</div></div>`;
        if (tab === "qr") b = `<div class="card center"><h2>Voting QR code</h2><p class="sub">Print it once. It always points to the current meeting.</p><div id="qr" style="display:inline-block;padding:12px;background:#fff;border-radius:12px;margin:8px 0"></div>
    <p class="mute">${esc(voterUrl())}</p>${/^(localhost|127\.)/.test(location.hostname) ? '<div class="note">This link only works on your computer. Deploy the site first, then download the QR code you will print.</div>' : ""}<button id="dl">Download QR code</button></div>`;
        app.innerHTML = `<div class="tabs">${tabs.map(([k, l]) => `<button class="${tab === k ? "on" : ""}" onclick="go('${k}')">${l}</button>`).join("")}</div>` + b;
        if ($("d")) $("d").valueAsDate = new Date();
        document.querySelectorAll(".chip[data-n]").forEach(c => c.onclick = () => { const t = lastTa || $("c_best_table_topic"); t.value += (t.value && !t.value.endsWith("\n") ? "\n" : "") + c.dataset.n + "\n"; });
        if ($("addp")) $("addp").onclick = async () => { const rows = $("pn").value.split("\n").map(x => x.trim()).filter(Boolean).map(name => ({ name })); if (rows.length) await sb.from("participants").upsert(rows, { onConflict: "name", ignoreDuplicates: true }); panel(); };
        if ($("qr")) { new QRCode($("qr"), { text: voterUrl(), width: 220, height: 220 }); $("dl").onclick = () => { const c = document.querySelector("#qr canvas"); const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "voting-qr.png"; a.click(); }; }
        if ($("save")) $("save").onclick = async () => {
          if (!$("t").value.trim()) { $("msg").textContent = "Enter a meeting title."; return; }
          const { data: m, error } = await sb.from("meetings").insert({ title: $("t").value.trim(), meeting_date: $("d").value }).select().single();
          if (error) { $("msg").textContent = error.message; return; }
          const rows = [];
          CATS.forEach(([k]) => $("c_" + k).value.split("\n").map(s => s.trim()).filter(Boolean).forEach(n => rows.push({ meeting_id: m.id, category: k, name: n })));
          if (rows.length) await sb.from("candidates").insert(rows);
          tab = "meetings"; panel();
        };
      }
      document.addEventListener("focusin", e => { if (e.target.tagName === "TEXTAREA") lastTa = e.target; });
      window.delPart = async id => { await sb.from("participants").delete().eq("id", id); panel(); };
      window.setStatus = async (id, status) => { if (status === "open") await sb.from("meetings").update({ status: "closed" }).eq("status", "open"); await sb.from("meetings").update({ status }).eq("id", id); panel(); };
      window.viewRes = async id => { const { data } = await sb.from("meetings").select("*").eq("id", id).single(); showResults(data, $("r_" + id)); };
      window.delMeeting = async id => { if (confirm("Delete this meeting and all its votes?")) { await sb.from("meetings").delete().eq("id", id); panel(); } };

      function route() {
        if (location.hash === "#admin") admin();
        else voter();
      }
      window.addEventListener("hashchange", route); route();
  </script>
</body>

</html>
